<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>lxqthz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --accent:  #6baed6;
  --accent-s: rgba(107,174,214,0.12);
  --bg:    #eff2f5;
  --card:  #ffffff;
  --border: rgba(0,0,0,0.06);
  --bh:    rgba(107,174,214,0.3);
  --text:  #1d2025;
  --sub:   #6b7a8a;
  --muted: #b0bec8;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  font-family:'Syne', sans-serif;
}

/* soft bg circles */
body::before, body::after {
  content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0;
}
body::before {
  width:520px; height:520px;
  top:-160px; right:-160px;
  background:radial-gradient(circle, rgba(107,174,214,0.09) 0%, transparent 70%);
}
body::after {
  width:400px; height:400px;
  bottom:-120px; left:-120px;
  background:radial-gradient(circle, rgba(107,174,214,0.06) 0%, transparent 70%);
}

.stage {
  position:relative; z-index:1;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; padding:28px 20px;
}

/* ── Card ── */
.card {
  position:relative;
  width:100%; max-width:380px;
  background:var(--card);
  border-radius:28px;
  border:1px solid rgba(255,255,255,0.9);
  padding:36px 28px 116px;
  box-shadow:
    0 2px 0 rgba(255,255,255,1) inset,
    0 1px 2px rgba(0,0,0,0.04),
    0 8px 32px rgba(0,0,0,0.07),
    0 32px 64px rgba(0,0,0,0.04);
  overflow:visible;
  animation:rise 0.75s cubic-bezier(0.16,1,0.3,1) both;
}
/* thin accent top rule */
.card::before {
  content:'';
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:48px; height:2.5px;
  background:var(--accent);
  border-radius:0 0 4px 4px;
  opacity:0.7;
}
@keyframes rise {
  from{ opacity:0; transform:translateY(18px); }
  to  { opacity:1; transform:translateY(0); }
}

/* ── Header ── */
.header {
  text-align:center;
  margin-bottom:22px;
  animation:up 0.7s 0.08s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes up {
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:translateY(0); }
}

.greeting {
  font-family:'JetBrains Mono', monospace;
  font-size:0.64em; font-weight:300;
  color:var(--accent);
  letter-spacing:3.5px; text-transform:uppercase;
  margin-bottom:4px;
}
.clock {
  font-family:'JetBrains Mono', monospace;
  font-size:0.68em; font-weight:300;
  color:var(--muted); letter-spacing:2px;
  margin-bottom:16px;
}
.name {
  font-family:'Syne', sans-serif;
  font-size:2.05em;
  font-weight:500;
  letter-spacing:2px;
  color:var(--text);
  line-height:1.2;
}

/* ── Divider ── */
.divider {
  display:flex; align-items:center; gap:10px;
  margin:18px 0;
  animation:up 0.7s 0.16s cubic-bezier(0.16,1,0.3,1) both;
}
.divider::before, .divider::after {
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--border));
}
.divider::after { transform:scaleX(-1); }
.divider span {
  font-size:0.55em; letter-spacing:3px;
  color:var(--muted); text-transform:uppercase;
  white-space:nowrap;
}

/* ── Primary Links ── */
.links-primary {
  display:flex; flex-direction:column; gap:8px;
  animation:up 0.7s 0.22s cubic-bezier(0.16,1,0.3,1) both;
}
.link-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 16px;
  background:#fafbfc;
  border:1px solid var(--border);
  border-radius:14px;
  text-decoration:none; color:var(--text);
  cursor:pointer;
  transition:all 0.2s ease;
}
.link-item:hover {
  background:var(--accent-s);
  border-color:var(--bh);
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(107,174,214,0.12);
}
.link-left { display:flex; align-items:center; gap:12px; }
.link-icon {
  width:34px; height:34px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.95em; flex-shrink:0;
  box-shadow:0 1px 2px rgba(0,0,0,0.04);
  transition:all 0.2s;
}
.link-item:hover .link-icon {
  border-color:rgba(107,174,214,0.3);
  background:rgba(107,174,214,0.06);
}
.link-title {
  font-size:0.87em; font-weight:600; color:var(--text); line-height:1.2;
}
.link-desc {
  font-size:0.68em; color:var(--sub);
  font-family:'JetBrains Mono', monospace;
  font-weight:300; margin-top:2px;
}
.link-badge {
  font-family:'JetBrains Mono', monospace;
  font-size:0.57em; font-weight:300;
  color:var(--muted);
  background:#fff; border:1px solid var(--border);
  padding:3px 9px; border-radius:7px;
  letter-spacing:1.5px; flex-shrink:0;
  transition:all 0.2s;
}
.link-item:hover .link-badge {
  color:var(--accent);
  border-color:rgba(107,174,214,0.3);
}

/* ── Pills ── */
.links-secondary {
  display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
  margin-top:12px;
  animation:up 0.7s 0.3s cubic-bezier(0.16,1,0.3,1) both;
}
.pill {
  display:flex; align-items:center; gap:4px;
  padding:5px 13px;
  background:#fafbfc; border:1px solid var(--border);
  border-radius:100px;
  text-decoration:none; color:var(--sub);
  font-size:0.73em; font-weight:500;
  letter-spacing:0.2px;
  transition:all 0.18s ease;
}
.pill:hover {
  color:var(--accent);
  background:var(--accent-s);
  border-color:rgba(107,174,214,0.25);
  transform:translateY(-1px);
}

/* ── Corner cat ── */
.cat-corner {
  position:absolute;
  bottom:0; right:16px;
  width:105px;
  pointer-events:none;
  animation:bob 5.5s ease-in-out infinite;
}
.cat-corner img { width:100%; display:block; }
@keyframes bob {
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-6px); }
}

/* ── Toast ── */
#toast {
  position:fixed; bottom:30px; left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--text); color:#fff;
  padding:9px 22px; border-radius:100px;
  font-size:0.8em; font-weight:500; letter-spacing:0.3px;
  opacity:0;
  transition:transform 0.38s cubic-bezier(0.16,1,0.3,1), opacity 0.38s;
  z-index:99; pointer-events:none;
}
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

@media (max-height:700px) {
  .card{ padding:24px 22px 92px; }
  .cat-corner{ width:84px; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="card">

    <div class="header">
      <div class="greeting" id="greeting">welcome</div>
      <div class="clock"    id="clock">00:00:00</div>
      <h1 class="name">lxqthz</h1>
    </div>

    <div class="divider"><span>links</span></div>

    <div class="links-primary">
      <a href="https://x.com/qthzZ" target="_blank" class="link-item">
        <div class="link-left">
          <div class="link-icon">𝕏</div>
          <div>
            <div class="link-title">X · Twitter</div>
            <div class="link-desc">@qthzZ</div>
          </div>
        </div>
        <span class="link-badge">follow</span>
      </a>

      <a href="https://qm.qq.com/q/IA2WDQcPG8" target="_blank" class="link-item">
        <div class="link-left">
          <div class="link-icon">🐧</div>
          <div>
            <div class="link-title">QQ</div>
            <div class="link-desc">即时通讯</div>
          </div>
        </div>
        <span class="link-badge">add</span>
      </a>

      <div class="link-item" onclick="cp('qthzawa@gmail.com','Email')">
        <div class="link-left">
          <div class="link-icon">✉</div>
          <div>
            <div class="link-title">Email</div>
            <div class="link-desc">qthzawa@gmail.com</div>
          </div>
        </div>
        <span class="link-badge">copy</span>
      </div>
    </div>

    <div class="links-secondary">
      <a href="https://t.me/lxqthz" target="_blank" class="pill">✈️ Telegram</a>
      <a href="https://youtube.com/qthzawa" target="_blank" class="pill">▶ YouTube</a>
      <a href="https://v.douyin.com/GxI--jRYcpU/" target="_blank" class="pill">🎵 抖音</a>
      <a href="https://discord.gg/UsaEcxwb" target="_blank" class="pill">👾 Discord</a>
      <a href="https://www.facebook.com/share/1CJboGmuet/" target="_blank" class="pill">ⓕ Facebook</a>
    </div>

    <div class="cat-corner">
      <img src="https://i.imgs.ovh/2026/06/05/fdca07931b2e46c44441d8c968b8d624.png" alt="">
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
function tick() {
  const n = new Date(), p = x => String(x).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  const h = n.getHours();
  document.getElementById('greeting').textContent =
    h<6  ? '夜深了' : h<12 ? '早上好' : h<18 ? '下午好' : '晚上好';
}
setInterval(tick, 1000); tick();

function cp(text, label) {
  (navigator.clipboard?.writeText(text) ?? Promise.reject()).catch(() => {
    const el = Object.assign(document.createElement('textarea'),{value:text});
    document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
  });
  const t = document.getElementById('toast');
  t.textContent = `${label} 已复制`;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
